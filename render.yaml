services:
  - type: web
    name: wbjee-exam
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/public
    disk:
      name: exam-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        generateValue: true
